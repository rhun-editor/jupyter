# The jupyter extension: rhun reads it from ~/.config/rhun/extensions/rhun-editor/jupyter/.
name = jupyter
owner = rhun-editor
title = Jupyter
description = Opens Jupyter notebooks (.ipynb) and runs their cells in the kernels your Python environments have.
color = #f37726
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/jupyter-linux-x86_64
run.macos-arm64 = bin/jupyter-macos-arm64
run.windows-x64 = bin/jupyter-windows-x64.exe
on = open:*.ipynb

[provides]
notebook = *.ipynb
notebook.title = Jupyter Notebook
notebook.kernel = yes
# completion in notebooks' Python cells, from their kernel (rhun hears cells as cell.py)
complete = *.py

# Kernels are Python programs (ipykernel, from a virtual environment in the project or python3 on
# PATH) that rhun starts as you when a cell first runs, after asking once per project; they listen
# on the loopback network, where the extension talks to them. The extension itself runs Python only
# to see which environments have ipykernel.
[needs]
documents = read
project = read
home = read
network = yes
run = python3 python
kernels = python3 python

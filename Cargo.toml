[package]
name = "jupyter"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Jupyter notebooks for the rhun editor: reads and writes .ipynb and runs cells in Jupyter kernels."

[dependencies]
# rhun-ext 1.4.1: protocol 1.1 (rhun 0.18)
rhun-ext = { git = "https://github.com/rhun-editor/extension-protocol", tag = "rust-v1.4.1" }
serde = "1"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
